[project]
name = "opennet"
version = "0.1.0"
description = "OpenNet - Fiddler 式 HTTP/HTTPS 抓包代理工具（FastAPI + 代理 + SQLite）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psutil>=5.9",
    "cryptography>=42.0",
    "pyinstaller>=6.0",
    "mcp>=1.2",
]

[project.scripts]
opennet = "opennet.__main__:main"
opennet-mcp = "opennet.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opennet*"]
