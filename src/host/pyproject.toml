[project]
name = "telnix"
version = "0.1.0"
description = "Telnix - Fiddler 式 HTTP/HTTPS 抓包代理工具（FastAPI + 代理 + SQLite）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psutil>=5.9",
    "cryptography>=42.0",
    "pyinstaller>=6.0",
    "mcp>=1.2",
    "h2>=4.1.0",
    "brotli>=1.1",
    "mitmproxy>=10.0",
]

[project.optional-dependencies]
# ip2region: IP 属地查询（离线 xdb 数据库）。代码已优雅降级，未安装时属地显示为空。
# 安装方式: pip install py-ip2region（PyPI 包名，提供 ip2region 模块）
ip-region = ["py-ip2region>=3.0.0"]
# Windows TCP/UDP 抓包驱动（仅 Windows，代码已优雅降级）
windows-capture = ["pydivert>=0.2.4"]

[project.scripts]
telnix = "telnix.__main__:main"
telnix-mcp = "telnix.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["telnix*"]
